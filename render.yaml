services:
  - type: web
    name: universal-video-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATA_DIR
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: UVD_BROWSER_ENABLED
        value: "0"
      - key: UVD_MAX_FILE_MB
        value: "2048"
      - key: UVD_MIN_FREE_DISK_MB
        value: "256"
      - key: UVD_MAX_HISTORY_JOBS
        value: "200"
      - key: UVD_FFMPEG_THREADS
        value: "2"
      - key: REQUEST_TIMEOUT
        value: "45"
      - key: MONGO_URI
        fromDatabase:
          name: uvd-history
          property: connectionString
      - key: MONGO_DB
        value: universal_downloader
      - key: MONGO_COLLECTION
        value: jobs
      - key: API_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        fromService:
          type: web
          name: universal-video-downloader
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: uvd-data
      mountPath: /data
      sizeGB: 1

databases:
  - name: uvd-history
    databaseName: universal_downloader
    plan: free
